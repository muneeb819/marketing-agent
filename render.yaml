services:
  - type: web
    name: marketingops-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python cli.py web --host 0.0.0.0 --port $PORT
    healthcheckPath: /api/status
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WEB_PASSWORD
        sync: false
