services:
  - type: web
    name: marketingops-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: mkdir -p data && python cli.py web --host 0.0.0.0 --port $PORT
    healthcheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: openai/gpt-4o
      - key: WEB_PASSWORD
        sync: false
      - key: DATA_DIR
        value: data
      - key: DB_PATH
        value: data/memory.db
